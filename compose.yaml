services:
  agent:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      HOST: 0.0.0.0
      DATA_DIR: /app/data
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - agent-data:/app/data
    stop_grace_period: 45s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  agent-data:
